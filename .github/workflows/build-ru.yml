name: Build OpenChamber RU

on:
  schedule:
    - cron: '0 12 * * *'  # Проверка раз в день в 12:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия оригинального OpenChamber (без v, например 1.22.0)'
        required: true
        type: string
      dry_run:
        description: 'Тестовый прогон — не публиковать'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  BUN_VERSION: '1.3.14'
  NODE_VERSION: '22'
  ORIGINAL_REPO: 'https://github.com/openchamber/openchamber.git'

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream release
        id: check
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "new_version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Используем указанную версию: ${{ github.event.inputs.version }}"
          else
            # Получаем последний релиз оригинального репозитория
            UPSTREAM_VERSION=$(curl -s https://api.github.com/repos/openchamber/openchamber/releases/latest | jq -r '.tag_name' | sed 's/^v//')
            CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
            
            echo "Оригинальная версия: $UPSTREAM_VERSION"
            echo "Текущая версия: $CURRENT_TAG"
            
            if [ "$UPSTREAM_VERSION" != "$CURRENT_TAG" ] && [ "$UPSTREAM_VERSION" != "null" ]; then
              echo "new_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Новая версия доступна!"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Обновлений нет"
            fi
          fi

  create-release:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ needs.check-upstream.outputs.new_version }}
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-upstream.outputs.new_version }}
          draft: true
          generate_release_notes: true
          name: OpenChamber RU v${{ needs.check-upstream.outputs.new_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone original OpenChamber
        run: |
          git clone --depth 1 --branch "v${{ needs.create-release.outputs.version }}" ${{ env.ORIGINAL_REPO }} build-source || \
          git clone --depth 1 ${{ env.ORIGINAL_REPO }} build-source

      - name: Apply Russian locale patch
        run: |
          cd build-source
          patch -p1 --forward < ../patches/ru-locale/ru-locale.patch || true
          cp ../patches/ru-locale/ru.ts packages/ui/src/lib/i18n/messages/ru.ts
          cp ../patches/ru-locale/ru.settings.ts packages/ui/src/lib/i18n/messages/ru.settings.ts

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: build-source
        run: bun install --frozen-lockfile

      - name: Cache OpenCode CLI
        uses: actions/cache@v4
        with:
          path: build-source/packages/electron/.cache/opencode-cli
          key: opencode-cli-linux-x64-${{ needs.create-release.outputs.version }}
          restore-keys: opencode-cli-linux-x64-

      - name: Build AppImage
        working-directory: build-source/packages/electron
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          bunx electron-builder --linux --x64 --publish=never

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: build-source/packages/electron/dist/OpenChamber-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone original OpenChamber
        run: |
          git clone --depth 1 --branch "v${{ needs.create-release.outputs.version }}" ${{ env.ORIGINAL_REPO }} build-source || \
          git clone --depth 1 ${{ env.ORIGINAL_REPO }} build-source

      - name: Apply Russian locale patch
        run: |
          cd build-source
          patch -p1 --forward < ../patches/ru-locale/ru-locale.patch || true
          cp ../patches/ru-locale/ru.ts packages/ui/src/lib/i18n/messages/ru.ts
          cp ../patches/ru-locale/ru.settings.ts packages/ui/src/lib/i18n/messages/ru.settings.ts

      - name: Install wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: build-source
        run: bun install --frozen-lockfile

      - name: Cache OpenCode CLI
        uses: actions/cache@v4
        with:
          path: build-source/packages/electron/.cache/opencode-cli
          key: opencode-cli-win-x64-${{ needs.create-release.outputs.version }}
          restore-keys: opencode-cli-win-x64-

      - name: Build Windows installer
        working-directory: build-source/packages/electron
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          bunx electron-builder --win nsis --x64 --publish=never

      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: build-source/packages/electron/dist/OpenChamber-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Clone original OpenChamber
        run: |
          git clone --depth 1 --branch "v${{ needs.create-release.outputs.version }}" ${{ env.ORIGINAL_REPO }} build-source || \
          git clone --depth 1 ${{ env.ORIGINAL_REPO }} build-source

      - name: Apply Russian locale patch
        run: |
          cd build-source
          patch -p1 --forward < ../patches/ru-locale/ru-locale.patch || true
          cp ../patches/ru-locale/ru.ts packages/ui/src/lib/i18n/messages/ru.ts
          cp ../patches/ru-locale/ru.settings.ts packages/ui/src/lib/i18n/messages/ru.settings.ts

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: build-source
        run: bun install --frozen-lockfile

      - name: Cache OpenCode CLI
        uses: actions/cache@v4
        with:
          path: build-source/packages/electron/.cache/opencode-cli
          key: opencode-cli-mac-x64-${{ needs.create-release.outputs.version }}
          restore-keys: opencode-cli-mac-x64-

      - name: Build macOS app (unsigned DMG + ZIP)
        working-directory: build-source/packages/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          bunx electron-builder --mac --x64 --publish=never \
            --config.mac.notarize=false \
            --config.mac.hardenedRuntime=false

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            build-source/packages/electron/dist/OpenChamber-*.dmg
            build-source/packages/electron/dist/OpenChamber-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone original OpenChamber
        run: |
          git clone --depth 1 --branch "v${{ needs.create-release.outputs.version }}" ${{ env.ORIGINAL_REPO }} build-source || \
          git clone --depth 1 ${{ env.ORIGINAL_REPO }} build-source

      - name: Apply Russian locale patch
        run: |
          cd build-source
          patch -p1 --forward < ../patches/ru-locale/ru-locale.patch || true
          cp ../patches/ru-locale/ru.ts packages/ui/src/lib/i18n/messages/ru.ts
          cp ../patches/ru-locale/ru.settings.ts packages/ui/src/lib/i18n/messages/ru.settings.ts

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: build-source
        run: bun install --frozen-lockfile

      - name: Build APK
        working-directory: build-source/packages/mobile
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: bun run build:android:debug

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: build-source/packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [create-release, build-linux, build-windows, build-macos, build-android]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
