name: Build OpenChamber_ru

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия оригинального OpenChamber (без v, например 1.22.0)'
        required: true
        type: string
      dry_run:
        description: 'Тестовый прогон — не публиковать'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  # Апстрим v2.6.1 объявляет packageManager bun@1.4.4 и TypeScript 7.
  BUN_VERSION: '1.4.4'
  NODE_VERSION: '22'
  # Секреты остаются на уровне шагов: на уровне workflow контекст secrets
  # GitHub Actions не раскрывает.
  ORIGINAL_REPO: 'https://github.com/openchamber/openchamber.git'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream release
        id: check
        env:
          # С токеном: анонимный лимит 60 запросов/час ловится руннером
          # постоянно (2026-10-22 16:33 — именно так скипнулась сборка).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "new_version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
            echo "new_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            UPSTREAM_VERSION=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              https://api.github.com/repos/openchamber/openchamber/releases/latest \
              | jq -r '.tag_name' | sed 's/^v//')
            CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")

            if [ "$UPSTREAM_VERSION" != "$CURRENT_TAG" ] && [ "$UPSTREAM_VERSION" != "null" ]; then
              echo "new_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  i18n-sync:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download upstream source
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-upstream.outputs.new_version }}"
          # codeload отдаёт tarball без git-протокола: git clone периодически
          # падает на GnuTLS, а tag tarball качается обычным HTTPS.
          rm -rf upstream-src && mkdir -p upstream-src
          if curl -fsSL --retry 3 --retry-delay 5 \
               "https://codeload.github.com/openchamber/openchamber/tar.gz/refs/tags/v${VERSION}" \
               -o /tmp/upstream.tar.gz \
             && tar -xzf /tmp/upstream.tar.gz -C upstream-src --strip-components=1; then
            echo "upstream v$VERSION получен через codeload"
          else
            echo "::warning::codeload не сработал — пробуем git clone"
            rm -rf upstream-src
            git clone --depth 1 --branch "v$VERSION" ${{ env.ORIGINAL_REPO }} upstream-src \
              || { echo "::error::Тег v$VERSION не найден в upstream"; exit 1; }
          fi

      - name: Auto-translate new keys
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
        run: |
          set -o pipefail
          # Переводчик не валит пайплайн: непереведённое уходит в pending.json
          # английскими заглушками и доберётся следующим прогоном. Если же он
          # упадёт сам (апстрим сменил формат), ci-autofix починит скрипт.
          node patches/ru-locale/ci-autofix.mjs \
            --command 'node patches/ru-locale/i18n-translate.mjs upstream-src/packages/ui/src/lib/i18n/messages patches/ru-locale' \
            --attempts 3 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee i18n-translate.log

      # Дымовой прогон ловит структурные поломки апстрима здесь, а не на
      # четырёх сборках сразу. Если патчер не применился или tsc упал,
      # ci-autofix отдаёт лог удалённой модели и применяет её правки к
      # patches/ru-locale; исправленные скрипты уезжают в артефакт.
      - name: Smoke-test Russian locale (self-healing)
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
          VERSION: ${{ needs.check-upstream.outputs.new_version }}
        run: |
          set -o pipefail
          node patches/ru-locale/ci-autofix.mjs \
            --command "bash patches/ru-locale/apply-ru-locale.sh \"$VERSION\" upstream-src && (cd upstream-src && bun install --frozen-lockfile && node_modules/.bin/tsc -b)" \
            --attempts 3 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee i18n-autofix.log

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-sync-logs-${{ needs.check-upstream.outputs.new_version }}
          path: |
            i18n-translate.log
            i18n-autofix.log
          if-no-files-found: ignore

      # Словарь отдаём артефактом: джобы сборки делают checkout на SHA запуска
      # и свежий коммит из main иначе не видят. Артефакт — единственный
      # способ гарантировать, что собирается именно переведённая версия.
      # Линейные модули (*.i18n.ts) берём все: апстрим периодически добавляет
      # новые, i18n-translate генерирует для них патчи на лету.
      - name: Publish translated dictionaries
        uses: actions/upload-artifact@v4
        with:
          name: ru-locale-${{ needs.check-upstream.outputs.new_version }}
          # Скрипты тоже в артефакте: если self-healing поправил патчер,
          # сборки должны получить именно исправленную версию, а не ту,
          # что лежит в SHA запуска.
          path: |
            patches/ru-locale/ru.ts
            patches/ru-locale/ru.settings.ts
            patches/ru-locale/*.i18n.ts
            patches/ru-locale/*.mjs
            patches/ru-locale/*.sh
            patches/ru-locale/pending.json
          if-no-files-found: error

      # README держит «Актуальная версия» и ссылки на скачивание. Раньше они
      # правились руками и отставали от релизов. Синхронизируем на каждый
      # релиз здесь; ссылки оживают, как только create-release опубликует тег.
      - name: Sync README version
        env:
          VERSION: ${{ needs.check-upstream.outputs.new_version }}
        run: |
          set -euo pipefail
          node patches/ru-locale/readme-sync.mjs "$VERSION" README.md
          git config user.name "OpenChamber RU bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README уже на v$VERSION — коммит не требуется."
            exit 0
          fi
          git commit -m "docs: README — актуальная версия v$VERSION"
          # Тот же сценарий гонки, что и у коммита переводов: rebase с повторами,
          # но финальную неудачу не молчим и не роняем релиз.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "README запушен с попытки $attempt."
              exit 0
            fi
            echo "::warning::push README не удался (попытка $attempt), пробуем снова"
            sleep $((attempt * 10))
          done
          echo "::error::Не удалось запушить README после 5 попыток."
          exit 0

      - name: Commit translations back to main
        env:
          VERSION: ${{ needs.check-upstream.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "OpenChamber RU bot"
          git config user.email "bot@users.noreply.github.com"
          git add patches/ru-locale/ru.ts patches/ru-locale/ru.settings.ts \
                  patches/ru-locale/*.i18n.ts patches/ru-locale/pending.json \
                  patches/ru-locale/*.mjs patches/ru-locale/*.sh
          if git diff --cached --quiet; then
            echo "Новых переводов и правок нет — коммит не требуется."
            exit 0
          fi
          git commit -m "i18n: auto-translate and self-heal patcher for v$VERSION"
          # Гонка возможна: cron запускается по расписанию, два прогона
          # могут делить ветку. Rebase с повторами вместо молчаливого || true.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Переводы запушены с попытки $attempt."
              exit 0
            fi
            echo "::warning::push не удался (попытка $attempt), пробуем снова"
            sleep $((attempt * 10))
          done
          echo "::error::Не удалось запушить переводы после 5 попыток — сборка продолжит с переданным артефактом."
          # Не роняем джобу: артефакт уже опубликован, сборка получит
          # переводы из него. Коммит в main — это удобство для истории.
          exit 0

  create-release:
    needs: [check-upstream, i18n-sync]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ needs.check-upstream.outputs.new_version }}
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-upstream.outputs.new_version }}
          draft: true
          generate_release_notes: true
          name: OpenChamber_ru v${{ needs.check-upstream.outputs.new_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream source
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.version }}"
          rm -rf build-source && mkdir -p build-source
          if curl -fsSL --retry 3 --retry-delay 5 \
               "https://codeload.github.com/openchamber/openchamber/tar.gz/refs/tags/v${VERSION}" \
               -o /tmp/upstream.tar.gz \
             && tar -xzf /tmp/upstream.tar.gz -C build-source --strip-components=1; then
            echo "upstream v$VERSION получен через codeload"
          else
            echo "::warning::codeload не сработал — пробуем git clone"
            rm -rf build-source
            git clone --depth 1 --branch "v$VERSION" ${{ env.ORIGINAL_REPO }} build-source \
              || { echo "::error::Тег v$VERSION не найден в upstream"; exit 1; }
          fi

      - name: Download translated locale
        uses: actions/download-artifact@v4
        with:
          name: ru-locale-${{ needs.create-release.outputs.version }}
          path: patches/ru-locale

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # electron-builder для Linux по умолчанию собирает ещё deb и rpm;
      # без rpmbuild джоба падает уже после успешной сборки AppImage.
      - name: Install Linux toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm build-essential python3 pkg-config libsecret-1-dev

      - name: Install dependencies
        working-directory: build-source
        run: bun install --frozen-lockfile

      - name: Apply Russian locale and typecheck (self-healing)
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -o pipefail
          # Без I18N_STRICT: непереведённые ключи — предупреждение, а не
          # остановка сборки. Структурные ошибки патчера лечит авторемонт.
          node patches/ru-locale/ci-autofix.mjs \
            --command "bash patches/ru-locale/apply-ru-locale.sh \"$VERSION\" build-source && (cd build-source && node_modules/.bin/tsc -b)" \
            --attempts 3 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee autofix-apply.log

      - name: Cache OpenCode CLI
        uses: actions/cache@v4
        with:
          path: build-source/packages/electron/.cache/opencode-cli
          key: opencode-cli-linux-x64-${{ needs.create-release.outputs.version }}
          restore-keys: opencode-cli-linux-x64-

      - name: Build AppImage (self-healing)
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
        run: |
          set -o pipefail
          node patches/ru-locale/ci-autofix.mjs \
            --command "cd build-source/packages/electron && bun run build:web-assets && bun run prepare:opencode-cli && bun run prepare:ripgrep && bun run bundle:main && bun run rebuild:native && bunx electron-builder --linux --x64 --publish=never" \
            --attempts 2 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee autofix-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-${{ needs.create-release.outputs.version }}
          path: |
            autofix-apply.log
            autofix-build.log
          if-no-files-found: ignore

      - name: Rename AppImage to OpenChamber_ru
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          appimage=$(find build-source/packages/electron/dist -name 'OpenChamber-*-linux-x86_64.AppImage' | head -1)
          mv "$appimage" "OpenChamber_ru-${VERSION}-linux-x86_64.AppImage"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: OpenChamber_ru-*-linux-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream source
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.version }}"
          rm -rf build-source && mkdir -p build-source
          if curl -fsSL --retry 3 --retry-delay 5 \
               "https://codeload.github.com/openchamber/openchamber/tar.gz/refs/tags/v${VERSION}" \
               -o /tmp/upstream.tar.gz \
             && tar -xzf /tmp/upstream.tar.gz -C build-source --strip-components=1; then
            echo "upstream v$VERSION получен через codeload"
          else
            echo "::warning::codeload не сработал — пробуем git clone"
            rm -rf build-source
            git clone --depth 1 --branch "v$VERSION" ${{ env.ORIGINAL_REPO }} build-source \
              || { echo "::error::Тег v$VERSION не найден в upstream"; exit 1; }
          fi

      - name: Download translated locale
        uses: actions/download-artifact@v4
        with:
          name: ru-locale-${{ needs.create-release.outputs.version }}
          path: patches/ru-locale

      - name: Install wine and build toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 build-essential python3 pkg-config

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: build-source
        run: bun install --frozen-lockfile

      - name: Apply Russian locale and typecheck (self-healing)
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -o pipefail
          node patches/ru-locale/ci-autofix.mjs \
            --command "bash patches/ru-locale/apply-ru-locale.sh \"$VERSION\" build-source && (cd build-source && node_modules/.bin/tsc -b)" \
            --attempts 3 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee autofix-apply.log

      - name: Cache OpenCode CLI
        uses: actions/cache@v4
        with:
          path: build-source/packages/electron/.cache/opencode-cli
          key: opencode-cli-win-x64-${{ needs.create-release.outputs.version }}
          restore-keys: opencode-cli-win-x64-

      - name: Build Windows installer (self-healing)
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
        run: |
          set -o pipefail
          node patches/ru-locale/ci-autofix.mjs \
            --command "cd build-source/packages/electron && bun run build:web-assets && bun run prepare:opencode-cli && bun run prepare:ripgrep && bun run bundle:main && bun run rebuild:native && bunx electron-builder --win nsis --x64 --publish=never" \
            --attempts 2 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee autofix-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-${{ needs.create-release.outputs.version }}
          path: |
            autofix-apply.log
            autofix-build.log
          if-no-files-found: ignore

      - name: Rename Windows installer to OpenChamber_ru
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          exe=$(find build-source/packages/electron/dist -name 'OpenChamber-*-win-x64.exe' | head -1)
          mv "$exe" "OpenChamber_ru-${VERSION}-win-x64.exe"

      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: OpenChamber_ru-*-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream source
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.version }}"
          rm -rf build-source && mkdir -p build-source
          if curl -fsSL --retry 3 --retry-delay 5 \
               "https://codeload.github.com/openchamber/openchamber/tar.gz/refs/tags/v${VERSION}" \
               -o /tmp/upstream.tar.gz \
             && tar -xzf /tmp/upstream.tar.gz -C build-source --strip-components=1; then
            echo "upstream v$VERSION получен через codeload"
          else
            echo "::warning::codeload не сработал — пробуем git clone"
            rm -rf build-source
            git clone --depth 1 --branch "v$VERSION" ${{ env.ORIGINAL_REPO }} build-source \
              || { echo "::error::Тег v$VERSION не найден в upstream"; exit 1; }
          fi

      - name: Download translated locale
        uses: actions/download-artifact@v4
        with:
          name: ru-locale-${{ needs.create-release.outputs.version }}
          path: patches/ru-locale

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: build-source
        run: bun install --frozen-lockfile

      - name: Apply Russian locale and typecheck (self-healing)
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -o pipefail
          node patches/ru-locale/ci-autofix.mjs \
            --command "bash patches/ru-locale/apply-ru-locale.sh \"$VERSION\" build-source && (cd build-source && node_modules/.bin/tsc -b)" \
            --attempts 3 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee autofix-apply.log

      - name: Cache OpenCode CLI
        uses: actions/cache@v4
        with:
          path: build-source/packages/electron/.cache/opencode-cli
          key: opencode-cli-mac-x64-${{ needs.create-release.outputs.version }}
          restore-keys: opencode-cli-mac-x64-

      - name: Build macOS app (unsigned DMG + ZIP, self-healing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: '--max-old-space-size=8192'
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
        run: |
          set -o pipefail
          node patches/ru-locale/ci-autofix.mjs \
            --command "cd build-source/packages/electron && bun run build:web-assets && bun run prepare:opencode-cli && bun run prepare:ripgrep && bun run bundle:main && bun run rebuild:native && bunx electron-builder --mac --x64 --publish=never --config.mac.notarize=false --config.mac.hardenedRuntime=false" \
            --attempts 2 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee autofix-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos-${{ needs.create-release.outputs.version }}
          path: |
            autofix-apply.log
            autofix-build.log
          if-no-files-found: ignore

      - name: Rename macOS artifacts to OpenChamber_ru
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          dmg=$(find build-source/packages/electron/dist -name 'OpenChamber-*-mac-x64.dmg' | head -1)
          zipf=$(find build-source/packages/electron/dist -name 'OpenChamber-*-mac-x64.zip' | head -1)
          mv "$dmg" "OpenChamber_ru-${VERSION}-mac-x64.dmg"
          mv "$zipf" "OpenChamber_ru-${VERSION}-mac-x64.zip"

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            OpenChamber_ru-*-mac-x64.dmg
            OpenChamber_ru-*-mac-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream source
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.version }}"
          rm -rf build-source && mkdir -p build-source
          if curl -fsSL --retry 3 --retry-delay 5 \
               "https://codeload.github.com/openchamber/openchamber/tar.gz/refs/tags/v${VERSION}" \
               -o /tmp/upstream.tar.gz \
             && tar -xzf /tmp/upstream.tar.gz -C build-source --strip-components=1; then
            echo "upstream v$VERSION получен через codeload"
          else
            echo "::warning::codeload не сработал — пробуем git clone"
            rm -rf build-source
            git clone --depth 1 --branch "v$VERSION" ${{ env.ORIGINAL_REPO }} build-source \
              || { echo "::error::Тег v$VERSION не найден в upstream"; exit 1; }
          fi

      - name: Download translated locale
        uses: actions/download-artifact@v4
        with:
          name: ru-locale-${{ needs.create-release.outputs.version }}
          path: patches/ru-locale

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: build-source
        run: bun install --frozen-lockfile

      - name: Apply Russian locale (self-healing)
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -o pipefail
          node patches/ru-locale/ci-autofix.mjs \
            --command "bash patches/ru-locale/apply-ru-locale.sh \"$VERSION\" build-source" \
            --attempts 3 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee autofix-apply.log

      - name: Build APK (self-healing)
        env:
          # ANDROID_HOME намеренно не задаём: раннер уже экспортирует путь
          # к установленному SDK, а `${{ env.ANDROID_HOME }}` в env шага
          # подставил бы пустую строку и сломал сборку.
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_USER: ${{ secrets.TRANSLATE_API_USER }}
          TRANSLATE_API_PASS: ${{ secrets.TRANSLATE_API_PASS }}
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_FALLBACK_MODEL: ${{ secrets.TRANSLATE_FALLBACK_MODEL }}
          TRANSLATE_RESERVE_MODEL: ${{ secrets.TRANSLATE_RESERVE_MODEL }}
          TRANSLATE_POOL: ${{ secrets.TRANSLATE_POOL }}
        run: |
          set -o pipefail
          node patches/ru-locale/ci-autofix.mjs \
            --command "cd build-source/packages/mobile && bun run build:android:debug" \
            --attempts 2 \
            --context .github/workflows/build-ru.yml \
            2>&1 | tee autofix-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-android-${{ needs.create-release.outputs.version }}
          path: |
            autofix-apply.log
            autofix-build.log
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cp build-source/packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "OpenChamber_ru-${VERSION}-android.apk"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: OpenChamber_ru-*-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [create-release, build-linux, build-windows, build-macos, build-android]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload install script to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: install-linux.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
